name: Wanderwithzen Post

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    name: Generate and publish one post
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Facebook publishing credential
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$FB_PAGE_TOKEN" ]; then
            echo "::error::FB_PAGE_TOKEN is missing. Add it under wander_bot Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Generate one post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_bot.py --action generate --platform facebook --location "travel, nature, hidden places, and mindful adventure"

      - name: Publish across configured platforms
        env:
          FB_PAGE_ID: "61589349864879"
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: "61589349864879"
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          THREADS_AUTH_TOKEN: ${{ secrets.THREADS_AUTH_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python run_bot.py --action publish --platform all

      - name: Save updated files back to repo
        run: |
          git config user.name "Wanderwithzen Bot"
          git config user.email "bot@wanderwithzen.com"
          git add posts.json log.json bot_state.json
          git diff --staged --quiet || git commit -m "bot: posted $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push